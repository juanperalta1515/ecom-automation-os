mu\u00f1eca\",\n        \"core_pain\": \"s\u00edndrome del t\u00fanel carpiano y dolor punzante en la mu\u00f1eca tras largas horas de mouse\",\n        \"main_benefit\": \"deslizar la mano con cero fricci\u00f3n y eliminar la fatiga articular por completo\",\n        \"dropship_platform\": \"DSers AliExpress / CJ Dropshipping\",\n        \"china_keywords\": \"Gliding wrist rest pad for mouse ergonomic palm rest\",\n        \"description\": \"Reposamu\u00f1ecas ergon\u00f3mico m\u00f3vil con patines de tefl\u00f3n y base acolchada viscoel\u00e1stica.\",\n    }\n]\n\n\nclass ProductCatalog:\n    \"\"\"\n    Search and filtering utilities for curated and custom candidate products.\n    \"\"\"\n\n    @staticmethod\n    def get_all_categories() -> List[str]:\n        categories = sorted(list(set(p[\"category\"] for p in CURATED_PRODUCTS)))\n        return [\"Todas las Categor\u00edas\"] + categories\n\n    @staticmethod\n    def search_products(\n        category: str = \"Todas las Categor\u00edas\",\n        product_type: str = \"Todos\",  # 'Todos', 'Evergreen', 'Viral/Trend'\n        search_query: str = \"\",\n        max_cost: Optional[float] = None,\n        min_multiplier: float = 0.0,\n    ) -> List[Dict[str, Any]]:\n        results = []\n        for p in CURATED_PRODUCTS:\n            # Filter category\n            if category != \"Todas las Categor\u00edas\" and p[\"category\"] != category:\n                continue\n\n            # Filter type\n            if product_type != \"Todos\" and p[\"product_type\"] != product_type:\n                continue\n\n            # Filter max cost\n            if max_cost is not None and p[\"cost_unit\"] > max_cost:\n                continue\n\n            # Filter multiplier\n            multiplier = p[\"target_price\"] / p[\"cost_unit\"]\n            if multiplier < min_multiplier:\n                continue\n\n            # Filter search query\n            if search_query:\n                q = search_query.lower()\n                text_corpus = f\"{p['name']} {p['category']} {p['audience']} {p['core_pain']} {p['description']}\".lower()\n                if q not in text_corpus:\n                    continue\n\n            results.append(p)\n\n        return results\n\n    @staticmethod\n    def add_custom_product(product_data: Dict[str, Any]) -> Dict[str, Any]:\n        \"\"\"Allows users to register custom discovered products into the runtime catalog.\"\"\"\n        prod_id = f\"custom_prod_{int(datetime.now().timestamp())}\"\n        new_prod = {\n            \"id\": prod_id,\n            \"name\": product_data.get(\"name\", \"Producto Personalizado\"),\n            \"category\": product_data.get(\"category\", \"General\"),\n            \"product_type\": product_data.get(\"product_type\", \"Evergreen\"),\n            \"cost_unit\": float(product_data.get(\"cost_unit\", 10.0)),\n            \"target_price\": float(product_data.get(\"target_price\", 39.99)),\n            \"wow_factor\": int(product_data.get(\"wow_factor\", 8)),\n            \"pain_passion\": int(product_data.get(\"pain_passion\", 8)),\n            \"offline_scarcity\": int(product_data.get(\"offline_scarcity\", 8)),\n            \"has_size_variants\": bool(product_data.get(\"has_size_variants\", False)),\n            \"is_fragile\": bool(product_data.get(\"is_fragile\", False)),\n            \"is_heavy\": bool(product_data.get(\"is_heavy\", False)),\n            \"is_battery\": bool(product_data.get(\"is_battery\", False)),\n            \"audience\": product_data.get(\"audience\", \"Compradores online\"),\n            \"core_pain\": product_data.get(\"core_pain\", \"problema cotidiano\"),\n            \"main_benefit\": product_data.get(\"main_benefit\", \"soluci\u00f3n r\u00e1pida\"),\n            \"dropship_platform\": product_data.get(\"dropship_platform\", \"CJ Dropshipping / AliExpress\"),\n            \"china_keywords\": product_data.get(\"china_keywords\", product_data.get(\"name\", \"\")),\n            \"description\": product_data.get(\"description\", \"Producto agregado por el usuario\"),\n        }\n        CURATED_PRODUCTS.insert(0, new_prod)\n        return new_prod\n\n    @staticmethod\n    def get_product_by_id(product_id: str) -> Optional[Dict[str, Any]]:\n        for p in CURATED_PRODUCTS:\n            if p[\"id\"] == product_id:\n                return p\n        return None\n", "modules/product_radar.py": "\"\"\"\nProduct Radar & Scoring Engine (5 Pillars Rule)\nEvaluates e-commerce products with algorithmic scoring based on high-performance DTC methodology and top dropshipping/importing criteria.\n\"\"\"\n\nfrom typing import Dict, Any, List, Tuple\n\n\nclass ProductRadar:\n    \"\"\"\n    Evaluates e-commerce products based on the 5 Pillars:\n    1. Multiplier / Gross Margin (3X - 5X)\n    2. Seasonality & Longevity (Evergreen vs Trend)\n    3. Visual WOW Factor (0-3s) & Pain/Passion intensity\n    4. Offline Scarcity (Hard to find locally)\n    5. Logistical Feasibility & Low Return Risk\n    \"\"\"\n\n    @staticmethod\n    def evaluate_product(\n        product_name: str,\n        category: str,\n        product_type: str,  # 'Viral/Trend' or 'Evergreen'\n        cost_unit: float,\n        target_price: float,\n        wow_factor_score: int,  # 1 to 10\n        pain_passion_score: int,  # 1 to 10\n        offline_scarcity_score: int,  # 1 to 10\n        has_size_variants: bool,  # True if fashion/apparel with complex sizes\n        is_fragile: bool,  # Glass, high breakage risk\n        is_heavy_or_bulky: bool,  # > 1.5 kg or bulky\n        is_electric_or_battery_risk: bool,  # uncertified electronics\n    ) -> Dict[str, Any]:\n        \"\"\"\n        Calculates 100-point index and returns a comprehensive evaluation verdict.\n        \"\"\"\n        cost_unit = max(0.01, float(cost_unit))\n        target_price = max(0.01, float(target_price))\n        multiplier = round(target_price / cost_unit, 2)\n        gross_margin_pct = round(((target_price - cost_unit) / target_price) * 100, 1)\n\n        # Pillar 1: Margin & Multiplier (Weight: 30 pts)\n        # Target: >= 3.0x (base), >= 4.0x (optimal), >= 5.0x (max)\n        margin_score = 0\n        if multiplier >= 5.0:\n            margin_score = 30\n        elif multiplier >= 4.0:\n            margin_score = 27\n        elif multiplier >= 3.0:\n            margin_score = 22\n        elif multiplier >= 2.5:\n            margin_score = 14\n        elif multiplier >= 2.0:\n            margin_score = 6\n        else:\n            margin_score = 0\n\n        # Pillar 2: Seasonality & Longevity (Weight: 15 pts)\n        seasonality_score = 0\n        if product_type == \"Evergreen\":\n            seasonality_score = 15  # Sells 12 months, continuous LTV\n        else:  # Viral / Trend\n            seasonality_score = 11  # Fast burst, shorter product lifecycle\n\n        # Pillar 3: Visual WOW (0-3s) & Pain/Passion (Weight: 25 pts)\n        # Normalizes 1-10 scores: (wow * 1.5) + (pain * 1.0) = max 25\n        wow_norm = min(10, max(1, wow_factor_score))\n        pain_norm = min(10, max(1, pain_passion_score))\n        wow_pain_score = int(round((wow_norm * 1.3) + (pain_norm * 1.2)))\n        wow_pain_score = min(25, wow_pain_score)\n\n        # Pillar 4: Offline Scarcity (Weight: 15 pts)\n        scarcity_norm = min(10, max(1, offline_scarcity_score))\n        scarcity_score = int(round((scarcity_norm / 10.0) * 15))\n\n        # Pillar 5: Logistical Risk & Return Feasibility (Weight: 15 pts)\n        logistic_deductions = 0\n        red_flags: List[str] = []\n\n        if has_size_variants:\n            logistic_deductions += 6\n            red_flags.append(\"Riesgo de devoluciones por talles (Indumentaria/Calzado).\")\n        if is_fragile:\n            logistic_deductions += 5\n            red_flags.append(\"Producto fr\u00e1gil/cristal (Riesgo alto de rotura en flete).\")\n        if is_heavy_or_bulky:\n            logistic_deductions += 3\n            red_flags.append(\"Volum\u00e9trico/Pesado (>1.5kg): Flete DDP o ePacket costoso.\")\n        if is_electric_or_battery_risk:\n            logistic_deductions += 3\n            red_flags.append(\"Electr\u00f3nica no homologada o bater\u00edas sin certificaci\u00f3n MSDS.\")\n\n        logistic_score = max(0, 15 - logistic_deductions)\n\n        # Total Calculation\n        total_score = margin_score + seasonality_score + wow_pain_score + scarcity_score + logistic_score\n        total_score = min(100, max(0, total_score))\n\n        # Strengths & Highlights\n        strengths: List[str] = []\n        if multiplier >= 3.5:\n            strengths.append(f\"Excelente margen bruto ({multiplier}X / {gross_margin_pct}% de margen).\")\n        if wow_norm >= 8:\n            strengths.append(\"Alto gancho visual en los primeros 3s (Ideal para TikTok/Reels).\")\n        if pain_norm >= 8:\n            strengths.append(\"Resuelve un dolor claro y agudo o pasi\u00f3n intensa del comprador.\")\n        if product_type == \"Evergreen\":\n            strengths.append(\"Demanda continua todo el a\u00f1o sin riesgo de colapso de tendencia.\")\n        if logistic_score == 15:\n            strengths.append(\"Log\u00edstica limpia y liviana: Bajo \u00edndice estimado de disputas y devoluciones.\")\n\n        # Verdict Decision Semaphore\n        verdict = \"\"\n        verdict_color = \"\"\n        verdict_summary = \"\"\n        action_recommendation = \"\"\n\n        if multiplier < 2.5:\n            verdict = \"\ud83d\udd34 DESCARTADO\"\n            verdict_color = \"error\"\n            verdict_summary = f\"Multiplicador insuficiente ({multiplier}X). No absorber\u00e1 el CPA de Meta ni comisiones de pasarela.\"\n            action_recommendation = \"Descartar o renegociar con el proveedor a un costo 40% menor antes de invertir en pauta.\"\n        elif total_score >= 78 and len(red_flags) == 0 and multiplier >= 3.0:\n            verdict = \"\ud83d\udfe2 APROBADO PARA TESTEO\"\n            verdict_color = \"success\"\n            verdict_summary = f\"Puntaje sobresaliente ({total_score}/100). Cumple los 5 pilares operativos con amplio colch\u00f3n financiero.\"\n            action_recommendation = \"Lanzar campa\u00f1a de validaci\u00f3n con estructura 3:2:2 en Meta Ads. Presupuesto diario inicial sugerido: 3X CPA Objetivo ($45-$60/d\u00eda).\"\n        elif total_score >= 60:\n            verdict = \"\ud83d\udfe1 DUDOSO / REQUIERE AJUSTE\"\n            verdict_color = \"warning\"\n            verdict_summary = f\"Puntaje moderado ({total_score}/100). Viable \u00fanicamente si se corrigen los puntos d\u00e9biles detectados.\"\n            action_recommendation = \"Crear ofertas Bundle (Lleva 2 con 15% OFF / Lleva 3 con 25% OFF) para elevar el AOV (Ticket Promedio) y mitigar el riesgo log\u00edstico.\"\n        else:\n            verdict = \"\ud83d\udd34 DESCARTADO\"\n            verdict_color = \"error\"\n            verdict_summary = f\"Puntaje bajo ({total_score}/100). Falla en pilares cr\u00edticos (margen, diferenciaci\u00f3n o riesgo log\u00edstico).\"\n            action_recommendation = \"No invertir en creativos ni pauta. Buscar alternativas en el mismo nicho con mayor efecto WOW y menor fricci\u00f3n log\u00edstica.\"\n\n        return {\n            \"product_name\": product_name,\n            \"category\": category,\n            \"product_type\": product_type,\n            \"cost_unit\": cost_unit,\n            \"target_price\": target_price,\n            \"multiplier\": multiplier,\n            \"gross_margin_pct\": gross_margin_pct,\n            \"total_score\": total_score,\n            \"pillar_breakdown\": {\n                \"Margen & Multiplicador (Max 30)\": margin_score,\n                \"Estacionalidad & Longevidad (Max 15)\": seasonality_score,\n                \"Efecto WOW & Dolor/Pasi\u00f3n (Max 25)\": wow_pain_score,\n                \"Escasez en Tienda F\u00edsica (Max 15)\": scarcity_score,\n                \"Seguridad Log\u00edstica (Max 15)\": logistic_score,\n            },\n            \"strengths\": strengths,\n            \"red_flags\": red_flags,\n            \"verdict\": verdict,\n            \"verdict_color\": verdict_color,\n            \"verdict_summary\": verdict_summary,\n            \"action_recommendation\": action_recommendation,\n        }\n", "modules/validation_blueprint.py": "\"\"\"\nValidation Blueprint & Roadmap Generator Module\nGenerates an actionable step-by-step operational roadmap for testing via the optimal dropshipping platform, validating mass volume, and transitioning to bulk DDP factory sourcing.\n\"\"\"\n\nfrom typing import Dict, Any, List\n\n\nclass ValidationBlueprint:\n    \"\"\"\n    Generates tailored execution blueprints for validated e-commerce products.\n    \"\"\"\n\n    @staticmethod\n    def generate_roadmap(\n        product_name: str,\n        category: str,\n        product_type: str,\n        cost_unit: float,\n        target_price: float,\n        target_cpa: float,\n        target_market: str = \"Estados Unidos / Global (Ingl\u00e9s)\",\n        fulfillment_mode: str = \"Autom\u00e1tico (Recomendado por Sistema)\",\n    ) -> Dict[str, Any]:\n        \"\"\"\n        Builds a 3-phase execution roadmap from initial dropshipping test to bulk DDP private label import.\n        \"\"\"\n        multiplier = round(target_price / max(0.01, cost_unit), 2)\n        daily_test_budget = round(target_cpa * 3.0, 2)  # 3X Target CPA\n        max_stop_loss_spend = round(target_cpa * 1.0, 2)\n        target_orders_validation = 35  # Target milestone: 35-50 orders in 7 days\n\n        # Select Optimal Dropshipping Platform\n        recommended_platform = \"\"\n        platform_reason = \"\"\n        integration_app = \"\"\n\n        if \"LATAM\" in target_market or \"Contraentrega\" in target_market:\n            recommended_platform = \"Dropi / Hoko / 99Minutos (Modelo Pago Contraentrega / COD)\"\n            platform_reason = \"En mercados hispanos y LATAM, el modelo COD (Cash On Delivery) convierte 3x a 5x m\u00e1s que las pasarelas tradicionales con stock local en bodega.\"\n            integration_app = \"Shopify + Dropi App / Releasit COD Form\"\n        elif \"TikTok\" in category or product_type == \"Viral/Trend\":\n            recommended_platform = \"CJ Dropshipping / Zendrop (L\u00edneas R\u00e1pidas US/EU 6-9 D\u00edas)\"\n            platform_reason = \"Productos de tendencia visual requieren sincronizaci\u00f3n de inventario en tiempo real y tiempos de despacho con tracking en menos de 48h para evitar contracargos.\"\n            integration_app = \"Shopify + CJ Dropshipping Sync / Zendrop Pro\"\n        else:  # Evergreen\n            recommended_platform = \"CJ Dropshipping / Wiio / Agente Privado de Sourcing\"\n            platform_reason = \"Permite solicitar empaque neutro sin publicidad de AliExpress y mejor control de calidad por lote para productos de uso diario continuo.\"\n            integration_app = \"Shopify + DSers / CJ Dropshipping\"\n\n        phases = [\n            {\n                \"phase_number\": \"FASE 1\",\n                \"phase_title\": \"Configuraci\u00f3n de la Oferta M\u00ednima Viable (MVP) & Plataforma Dropshipping\",\n                \"badge\": \"D\u00eda 1 - 2\",\n                \"steps\": [\n                    {\n                        \"step_title\": \"1.1 Conexi\u00f3n con Proveedor de Dropshipping\",\n                        \"details\": f\"Importar el producto **{product_name}** a tu tienda utilizando **{recommended_platform}**. Verificar que el costo base m\u00e1s env\u00edo ePacket/YunExpress no supere **${cost_unit:.2f} USD**.\",\n                        \"tip\": \"Solicitar al agente de la plataforma que confirme stock disponible mayor a 500 unidades antes de encender pauta.\"\n                    },\n                    {\n                        \"step_title\": \"1.2 Arquitectura de Conversi\u00f3n en Shopify\",\n                        \"details\": f\"Publicar la ficha de producto con el t\u00edtulo optimizado, vi\u00f1etas de dolor/soluci\u00f3n (PAS) y configurar los 3 bundles de checkout: 1 unidad a **${target_price:.2f}**, 2 unidades con 15% OFF (**${(target_price*0.85*2):.2f}**) y 3 unidades con 25% OFF + Env\u00edo Gratis (**${(target_price*0.75*3):.2f}**).\",\n                        \"tip\": \"Instalar aplicaci\u00f3n de Bundles / Upsell (como Kaching Bundles o Wide Bundles) para forzar un AOV (Ticket Promedio) m\u00e1s alto.\"\n                    },\n                    {\n                        \"step_title\": \"1.3 Pasarela de Pago & Pol\u00edticas Blindadas\",\n                        \"details\": \"Asegurar pasarela activa (Stripe / Shopify Payments / PayPal / COD Form) y publicar p\u00e1ginas legales (Pol\u00edtica de Env\u00edos de 7-12 d\u00edas, Garant\u00eda de Devoluci\u00f3n de 30 D\u00edas y Contacto de Soporte).\",\n                        \"tip\": \"Tener configurado el correo de confirmaci\u00f3n de pedido con n\u00famero de seguimiento para reducir disputas al 0%.\"\n                    }\n                ]\n            },\n            {\n                \"phase_number\": \"FASE 2\",\n                \"phase_title\": \"Protocolo de Testeo de Tr\u00e1fico & Validaci\u00f3n de Volumen\",\n                \"badge\": \"D\u00eda 3 - 9\",\n                \"steps\": [\n                    {\n                        \"step_title\": \"2.1 Lanzamiento de Campa\u00f1a Din\u00e1mica 3:2:2\",\n                        \"details\": f\"Crear 1 Campa\u00f1a de Prueba (CBO o ABO) en Meta Ads con **3 Hooks de video distintos (0-3s)**, **2 Cuerpos demostrativos** y **2 Textos principales**. Presupuesto diario asignado: **${daily_test_budget:.2f} USD/d\u00eda** (3X CPA Objetivo).\",\n                        \"tip\": \"P\u00fablico amplio (Broad) o 3-5 intereses consolidados del nicho. Dejar que el algoritmo encuentre los compradores.\"\n                    },\n                    {\n                        \"step_title\": \"2.2 Regla de Corte Implacable (Stop-Loss)\",\n                        \"details\": f\"Si un creativo gasta **${max_stop_loss_spend:.2f} USD** (1X CPA Objetivo) sin ninguna compra, se apaga antes de medianoche. Si gasta el 50% del CPA sin ning\u00fan 'Add to Cart', descartar el \u00e1ngulo de creativo.\",\n                        \"tip\": \"Cero emoci\u00f3n en la toma de decisiones: cortar p\u00e9rdidas r\u00e1pido y redirigir presupuesto al hook con mejor CTR (>1.5%).\"\n                    },\n                    {\n                        \"step_title\": \"2.3 Hito de Validaci\u00f3n de Masa Cr\u00edtica\",\n                        \"details\": f\"**Criterio de Validaci\u00f3n Exitosa:** Lograr entre **{target_orders_validation} y 50 pedidos** en los primeros 7 d\u00edas con un ROAS estable sobre el Break-Even.\",\n                        \"tip\": \"En cuanto se alcance este hito, el producto queda oficialmente VALIDADO como ganador de mercado.\"\n                    }\n                ]\n            },\n            {\n                \"phase_number\": \"FASE 3\",\n                \"phase_title\": \"Transici\u00f3n a Importaci\u00f3n DDP & Escalamiento a Gran Escala\",\n                \"badge\": \"D\u00eda 10 en Adelante\",\n                \"steps\": [\n                    {\n                        \"step_title\": \"3.1 Cotizaci\u00f3n con Fabricantes Directos en China (1688 / Alibaba)\",\n                        \"details\": f\"Enviar el mensaje **RFQ profesional generado por el sistema** a 3-5 f\u00e1bricas verificadas (Gold Suppliers / Verified Manufacturers). Solicitar precios escalonados (300, 500 y 1,000 unidades) bajo t\u00e9rminos **Incoterms DDP** (flete mar\u00edtimo y a\u00e9reo con impuestos aduaneros pagos en destino).\",\n                        \"tip\": \"Negociar siempre el empaque personalizado con logo (Private Label) y pedir tarjeta de inserto de agradecimiento para construir marca.\"\n                    },\n                    {\n                        \"step_title\": \"3.2 Pedido de Muestra & Control de Calidad (AQL 2.5)\",\n                        \"details\": \"Pedir 1-2 unidades de muestra por DHL/FedEx Express para verificar acabado, costuras o componentes electr\u00f3nicos. Contratar inspecci\u00f3n de calidad previa al embarque.\",\n                        \"tip\": \"Pagar el 30% de anticipo para iniciar producci\u00f3n y el 70% restante \u00fanicamente tras recibir el reporte de inspecci\u00f3n aprobado.\"\n                    },\n                    {\n                        \"step_title\": \"3.3 Traspaso a Almac\u00e9n 3PL Local & Campa\u00f1a Advantage+ (ASC)\",\n                        \"details\": \"Recibir el lote consolidado en tu centro de fulfillment 3PL local (env\u00edos en 24-48h a tus clientes). Traspasar los creativos ganadores a campa\u00f1as **Meta Advantage+ Shopping (ASC)** para escalar el presupuesto diario un 20% cada 48h con un margen neto duplicado (>35-45%).\",\n                        \"tip\": \"Con stock local y env\u00edos de 24-48h, las rese\u00f1as suben a 4.9 estrellas y la tasa de recompra se multiplica.\"\n                    }\n                ]\n            }\n        ]\n\n        return {\n            \"product_name\": product_name,\n            \"category\": category,\n            \"target_market\": target_market,\n            \"recommended_platform\": recommended_platform,\n            \"platform_reason\": platform_reason,\n            \"integration_app\": integration_app,\n            \"daily_test_budget\": daily_test_budget,\n            \"max_stop_loss_spend\": max_stop_loss_spend,\n            \"target_orders_validation\": target_orders_validation,\n            \"phases\": phases,\n        }\n", "modules/ai_creative_factory.py": "\"\"\"\nAI Creative Factory Module\nGenerates Meta Ads 3:2:2 video scripts, Shopify PAS/AIDA product listings, bundle offers, and ready-to-use ElevenLabs & Midjourney/Flair.ai prompts.\n\"\"\"\n\nfrom typing import Dict, Any, List\n\n\nclass AICreativeFactory:\n    \"\"\"\n    Automates creative generation for Meta Ads testing and Shopify conversion rate optimization (CRO).\n    \"\"\"\n\n    @staticmethod\n    def generate_meta_322_scripts(\n        product_name: str,\n        category: str,\n        target_audience: str,\n        core_pain: str,\n        main_benefit: str,\n        target_price: float,\n    ) -> Dict[str, Any]:\n        \"\"\"\n        Generates 3 distinct hooks + 2 body variations + 2 CTAs according to Meta's 3:2:2 dynamic testing framework.\n        \"\"\"\n        price_str = f\"${target_price:.2f}\"\n\n        # 3 Distinct Hooks (0 - 3 seconds)\n        hooks = [\n            {\n                \"id\": \"Hook 1 (Shock / Curiosidad)\",\n                \"visual_action\": f\"[Primer plano r\u00e1pido a c\u00e1mara con corte abrupto]: La persona sostiene el {product_name} con expresi\u00f3n de sorpresa o muestra el error com\u00fan de la competencia.\",\n                \"voiceover_es\": f\"\u00a1Si todav\u00eda est\u00e1s luchando con {core_pain}, necesitas dejar lo que est\u00e1s haciendo y mirar esto!\",\n                \"on_screen_text\": f\"\ud83d\udea8 \u00bfA\u00fan sufres por {core_pain[:30]}...? Mira esto \ud83d\udc47\",\n            },\n            {\n                \"id\": \"Hook 2 (Dolor Directo / Empat\u00eda Aguda)\",\n                \"visual_action\": f\"[Toma cotidiana en primer plano]: Persona frustrada sufriendo exactamente por {core_pain}. Cambio s\u00fabito a blanco y negro con efecto de estr\u00e9s.\",\n                \"voiceover_es\": f\"El 90% de las personas comete este error intentando resolver {core_pain} sin saber que hay una forma 10 veces m\u00e1s r\u00e1pida.\",\n                \"on_screen_text\": f\"\u274c Deja de perder tiempo con {core_pain[:28]}...\",\n            },\n            {\n                \"id\": \"Hook 3 (Demostraci\u00f3n de Transformaci\u00f3n R\u00e1pida)\",\n                \"visual_action\": f\"[Pantalla dividida Antes / Despu\u00e9s de 1.5 segundos]: A la izquierda el problema ca\u00f3tico, a la derecha el {product_name} resolvi\u00e9ndolo en 2 segundos.\",\n                \"voiceover_es\": f\"Prob\u00e9 decenas de soluciones para {core_pain}... y este peque\u00f1o dispositivo cambi\u00f3 todo en 48 horas.\",\n                \"on_screen_text\": f\"\u2728 El cambio de 0 a 100 con {product_name} \ud83d\udd25\",\n            },\n        ]\n\n        # 2 Body / Demonstration Variations (3 - 20 seconds)\n        bodies = [\n            {\n                \"id\": \"Variaci\u00f3n A (F\u00f3rmula PAS - Problema, Agitaci\u00f3n, Mecanismo)\",\n                \"visual_flow\": f\"1. Demostraci\u00f3n en uso real del {product_name} en \u00e1ngulo de 45\u00b0.\\n2. Zoom a los detalles de calidad o funci\u00f3n clave.\\n3. Reacci\u00f3n de alivio genuino y sonrisa de satisfacci\u00f3n.\",\n                \"voiceover_es\": f\"El problema es que las soluciones tradicionales son caras y lentas. El nuevo {product_name} fue dise\u00f1ado espec\u00edficamente para {main_benefit} sin complicaciones. Simplemente lo usas y sientes la diferencia desde el minuto uno.\",\n            },\n            {\n                \"id\": \"Variaci\u00f3n B (F\u00f3rmula AIDA - Inter\u00e9s, Deseo, Prueba Social)\",\n                \"visual_flow\": f\"1. Unboxing express o puesta en marcha instant\u00e1nea.\\n2. Superposici\u00f3n de 5 estrellas \u2605\u2605\u2605\u2605\u2605 y citas de rese\u00f1as de clientes felices.\\n3. Demostraci\u00f3n de portabilidad o practicidad extrema.\",\n                \"voiceover_es\": f\"Dise\u00f1ado con tecnolog\u00eda de grado premium, te permite conseguir {main_benefit} en segundos. Miles de personas en todo el pa\u00eds ya lo convirtieron en su accesorio esencial de todos los d\u00edas.\",\n            },\n        ]\n\n        # 2 Call To Action Variations (\u00daltimos 5 segundos)\n        ctas = [\n            {\n                \"id\": \"CTA 1 (Urgencia & Descuento de Lanzamiento)\",\n                \"visual_flow\": f\"Mockup del producto en caja + Sticker '50% OFF HOY' + bot\u00f3n animado de 'Comprar Ahora'.\",\n                \"voiceover_es\": f\"Haz clic en el enlace de abajo y aprovecha el 50% de descuento con env\u00edo express antes de que se agote el stock de lanzamiento.\",\n                \"on_screen_text\": f\"\ud83d\udd25 50% OFF SOLO POR HOY | Env\u00edo R\u00e1pido \ud83d\ude9a\",\n            },\n            {\n                \"id\": \"CTA 2 (Garant\u00eda de Satisfacci\u00f3n 100% Cero Riesgo)\",\n                \"visual_flow\": f\"Insignia de 'Garant\u00eda de 30 D\u00edas' + Bot\u00f3n parpadeante 'Pide el tuyo aqu\u00ed'.\",\n                \"voiceover_es\": f\"Pru\u00e9balo durante 30 d\u00edas sin riesgo. Si no transforma tu d\u00eda, te devolvemos el 100% de tu dinero. Toca 'Comprar Ahora'.\",\n                \"on_screen_text\": f\"\ud83d\udee1\ufe0f Garant\u00eda de Devoluci\u00f3n de 30 D\u00edas | Stock Limitado\",\n            },\n        ]\n\n        return {\n            \"framework\": \"Meta Ads 3:2:2 Testing Engine\",\n            \"product_name\": product_name,\n            \"target_price\": price_str,\n            \"hooks\": hooks,\n            \"bodies\": bodies,\n            \"ctas\": ctas,\n        }\n\n    @staticmethod\n    def generate_shopify_listing(\n        product_name: str,\n        category: str,\n        target_audience: str,\n        core_pain: str,\n        main_benefit: str,\n        target_price: float,\n    ) -> Dict[str, Any]:\n        \"\"\"\n        Generates high-converting Shopify product descriptions, PAS/AIDA bullet points, and high-AOV bundle tables.\n        \"\"\"\n        p1 = target_price\n        p2_unit = round(target_price * 0.85, 2)  # 15% discount\n        p2_total = round(p2_unit * 2, 2)\n        p3_unit = round(target_price * 0.75, 2)  # 25% discount\n        p3_total = round(p3_unit * 3, 2)\n\n        seo_title = f\"{product_name} Pro\u2122 - Soluci\u00f3n Premium para {main_benefit.title()} | Env\u00edo Express\"\n\n        bullets_pas = [\n            f\"\u26a1 **Adi\u00f3s a {core_pain}:** Dise\u00f1ado ergon\u00f3micamente para atacar el origen del problema de ra\u00edz sin esfuerzo.\",\n            f\"\ud83c\udfaf **{main_benefit.capitalize()}:** Obt\u00e9n resultados tangibles y medibles desde el primer uso comprobado.\",\n            f\"\ud83d\udc8e **Materiales de Calidad Grado Profesional:** Construcci\u00f3n ultra resistente y duradera para uso diario continuo.\",\n            f\"\ud83d\ude80 **Ahorro de Tiempo y Dinero:** Olv\u00eddate de costosos tratamientos o productos gen\u00e9ricos que no funcionan.\",\n            f\"\ud83d\udee1\ufe0f **Garant\u00eda Blindada de 30 D\u00edas:** Si no cumple 100% tus expectativas, te devolvemos el dinero sin preguntas.\",\n        ]\n\n        bundles = [\n            {\n                \"tier\": \"Paquete 1 Unidad\",\n                \"badge\": \"Prueba Individual\",\n                \"price\": f\"${p1:.2f}\",\n                \"savings\": \"Precio Regular\",\n                \"shipping\": \"Env\u00edo Est\u00e1ndar\",\n            },\n            {\n                \"tier\": \"Paquete 2 Unidades (D\u00fao Pack)\",\n                \"badge\": \"\ud83d\udd25 M\u00c1S POPULAR (Ahorra 15%)\",\n                \"price\": f\"${p2_total:.2f} (${p2_unit:.2f}/ud)\",\n                \"savings\": f\"Ahorras ${(p1 * 2 - p2_total):.2f}\",\n                \"shipping\": \"Env\u00edo Prioritario Bonificado\",\n            },\n            {\n                \"tier\": \"Paquete 3 Unidades (Familiar / Regalo)\",\n                \"badge\": \"\u2b50 MEJOR VALOR (Ahorra 25%)\",\n                \"price\": f\"${p3_total:.2f} (${p3_unit:.2f}/ud)\",\n                \"savings\": f\"Ahorras ${(p1 * 3 - p3_total):.2f}\",\n                \"shipping\": \"Env\u00edo Express GRATIS a Todo el Pa\u00eds\",\n            },\n        ]\n\n        faqs = [\n            {\n                \"q\": \"\u00bfEn cu\u00e1nto tiempo recibir\u00e9 mi pedido?\",\n                \"a\": \"Los env\u00edos se despachan dentro de las 24-48 horas h\u00e1biles con n\u00famero de seguimiento en tiempo real.\",\n            },\n            {\n                \"q\": \"\u00bfQu\u00e9 pasa si no me convence el producto?\",\n                \"a\": \"Ofrecemos garant\u00eda de satisfacci\u00f3n de 30 d\u00edas. Si no est\u00e1s fascinado con los resultados, te reembolsamos tu compra.\",\n            },\n            {\n                \"q\": \"\u00bfEs seguro comprar en este sitio web?\",\n                \"a\": \"Procesamos pagos mediante pasarelas con cifrado SSL de 256 bits y protecci\u00f3n total al comprador.\",\n            },\n        ]\n\n        return {\n            \"seo_title\": seo_title,\n            \"bullets\": bullets_pas,\n            \"bundles\": bundles,\n            \"faqs\": faqs,\n        }\n\n    @staticmethod\n    def generate_ai_prompts(product_name: str, category: str, main_benefit: str) -> Dict[str, str]:\n        \"\"\"\n        Generates copy-paste ready prompts for ElevenLabs and Midjourney / Flair.ai.\n        \"\"\"\n        elevenlabs_prompt = (\n            f\"Voice Style: Engaging, energetic yet authoritative, warm commercial American or Latin-Spanish tone. \"\n            f\"Pacing: 1.1x speed for TikTok / Meta Reels. Emotional arc: starts curious/concerned, shifts to enthusiastic, \"\n            f\"ends with high urgency CTA. Stability: 0.45, Clarity: 0.85, Style Exaggeration: 0.20.\"\n        )\n\n        midjourney_prompt = (\n            f\"/imagine prompt: Commercial studio hero photography of a modern sleek {product_name} in {category} niche, \"\n            f\"clean minimalist luxury background, soft studio rim lighting, subtle pastel aesthetic, depth of field, \"\n            f\"ultra sharp focus, shot on Hasselblad H6D-100c, 8k resolution, photorealistic, advertising mockup style --ar 1:1 --v 6.0 --style raw\"\n        )\n\n        flair_ai_prompt = (\n            f\"Product: {product_name}. Background scene: Elegant wooden marble podium surrounded by subtle aesthetic props related to {category}. \"\n            f\"Natural window sunlight streaming from the left, soft shadows, high-end e-commerce DTC brand look.\"\n        )\n\n        return {\n            \"elevenlabs\": elevenlabs_prompt,\n            \"midjourney\": midjourney_prompt,\n            \"flair_ai\": flair_ai_prompt,\n        }\n", "modules/ads_analytics.py": "\"\"\"\nAds Analytics & Media Buying Optimization Module\nCalculates Break-Even ROAS, Target CPA, and algorithmic Kill / Scale decision matrices for Meta Ads & TikTok Ads.\n\"\"\"\n\nfrom typing import Dict, Any, List\n\n\nclass AdsAnalytics:\n    \"\"\"\n    Algorithmic Media Buying Assistant.\n    \"\"\"\n\n    @staticmethod\n    def calculate_targets(\n        sale_price: float,\n        cost_unit: float,\n        shipping_fee_charged: float = 0.0,\n        gateway_fee_pct: float = 3.5,  # Shopify Payments / Stripe / PayPal\n        desired_net_margin_pct: float = 25.0,  # 25% target profit after ads\n    ) -> Dict[str, Any]:\n        \"\"\"\n        Computes key financial guardrails: Break-Even ROAS and Target CPA.\n        \"\"\"\n        total_revenue = sale_price + shipping_fee_charged\n        gateway_fee = total_revenue * (gateway_fee_pct / 100.0)\n        cogs_and_fees = cost_unit + gateway_fee\n        gross_profit = total_revenue - cogs_and_fees\n\n        gross_margin_pct = (gross_profit / total_revenue) * 100.0 if total_revenue > 0 else 0.0\n\n        # Break-even ROAS = 1 / Gross Margin %\n        be_roas = (100.0 / gross_margin_pct) if gross_margin_pct > 0 else 999.0\n        be_cpa = gross_profit  # Break-even CPA is the entire gross profit\n\n        # Target CPA to achieve desired net profit margin\n        desired_net_profit = total_revenue * (desired_net_margin_pct / 100.0)\n        target_cpa = max(1.0, gross_profit - desired_net_profit)\n        target_roas = total_revenue / target_cpa if target_cpa > 0 else be_roas\n\n        return {\n            \"sale_price\": sale_price,\n            \"cost_unit\": cost_unit,\n            \"total_revenue\": round(total_revenue, 2),\n            \"gross_profit\": round(gross_profit, 2),\n            \"gross_margin_pct\": round(gross_margin_pct, 1),\n            \"be_roas\": round(be_roas, 2),\n            \"be_cpa\": round(be_cpa, 2),\n            \"target_cpa\": round(target_cpa, 2),\n            \"target_roas\": round(target_roas, 2),\n            \"desired_net_profit_per_order\": round(desired_net_profit, 2),\n        }\n\n    @staticmethod\n    def analyze_ad_performance(\n        ad_name: str,\n        spend: float,\n        impressions: int,\n        link_clicks: int,\n        add_to_carts: int,\n        purchases: int,\n        revenue: float,\n        target_cpa: float,\n        be_roas: float,\n    ) -> Dict[str, Any]:\n        \"\"\"\n        Applies algorithmic stop-loss and scaling rules.\n        \"\"\"\n        spend = max(0.0, float(spend))\n        impressions = max(1, int(impressions))\n        link_clicks = max(0, int(link_clicks))\n        add_to_carts = max(0, int(add_to_carts))\n        purchases = max(0, int(purchases))\n        revenue = max(0.0, float(revenue))\n\n        # Core Metrics\n        cpm = round((spend / impressions) * 1000.0, 2)\n        ctr_link = round((link_clicks / impressions) * 100.0, 2)\n        cpc = round(spend / link_clicks, 2) if link_clicks > 0 else 0.0\n        real_cpa = round(spend / purchases, 2) if purchases > 0 else 0.0\n        real_roas = round(revenue / spend, 2) if spend > 0 else 0.0\n\n        # Algorithmic Evaluation\n        status = \"\"\n        action_color = \"\"\n        decision_label = \"\"\n        explanation = \"\"\n        recommendations: List[str] = []\n\n        # Rule 1: No Sales and High Spend (Kill Condition)\n        if purchases == 0:\n            if spend >= target_cpa:\n                status = \"\ud83d\udd34 KILL (APAGAR INMEDIATAMENTE)\"\n                action_color = \"error\"\n                decision_label = \"Corte de Sangr\u00eda (Stop-Loss)\"\n                explanation = f\"El anuncio gast\u00f3 ${spend:.2f} (>= 1.0X CPA Objetivo ${target_cpa:.2f}) con 0 compras registradas.\"\n                recommendations.append(\"Apagar el conjunto de anuncios/creativo para no quemar presupuesto en tr\u00e1fico fr\u00edo sin intenci\u00f3n.\")\n            elif spend >= (target_cpa * 0.5) and add_to_carts == 0:\n                status = \"\ud83d\udd34 KILL (APAGAR)\"\n                action_color = \"error\"\n                decision_label = \"Falta Total de Intenci\u00f3n de Compra\"\n                explanation = f\"Gast\u00f3 ${spend:.2f} (50% del CPA Objetivo) sin generar un solo 'Add to Cart'.\"\n                recommendations.append(\"El gancho o la oferta no resuenan con la audiencia. Reemplazar creativo o mejorar pricing.\")\n            else:\n                status = \"\ud83d\udfe1 TESTING (EN OBSERVACI\u00d3N)\"\n                action_color = \"warning\"\n                decision_label = \"Fase de Aprendizaje Temprano\"\n                explanation = f\"Gasto actual (${spend:.2f}) a\u00fan por debajo del umbral de stop-loss (${target_cpa:.2f}).\"\n                recommendations.append(f\"Dejar correr hasta alcanzar ${target_cpa:.2f} de gasto antes de tomar una decisi\u00f3n definitiva.\")\n\n        # Rule 2: Sales with Underperforming ROAS (Kill / Optimize)\n        elif real_roas < be_roas:\n            status = \"\ud83d\udd34 KILL / REESTRUCTURAR\"\n            action_color = \"error\"\n            decision_label = \"ROAS No Rentable (Por debajo del Punto de Equilibrio)\"\n            explanation = f\"ROAS real de {real_roas:.2f}x es menor al Break-Even ({be_roas:.2f}x). Cada venta genera p\u00e9rdida neta.\"\n            recommendations.append(\"Revisar si el CTR es bajo (<1.0%) o si la p\u00e1gina de aterrizaje tiene baja tasa de conversi\u00f3n.\")\n            recommendations.append(\"Intentar bundle de 2x/3x unidades en la tienda para subir el Ticket Promedio antes de re-testear.\")\n\n        # Rule 3: Profitable and Stable (Scale to ASC)\n        elif real_roas >= (be_roas * 1.4) and real_cpa <= target_cpa:\n            if real_roas >= 2.2 and purchases >= 5:\n                status = \"\ud83d\ude80 ESCALAR A ADVANTAGE+ (ASC)\"\n                action_color = \"success\"\n                decision_label = \"Creativo Ganador Validado\"\n                explanation = f\"ROAS excepcional de {real_roas:.2f}x (CPA: ${real_cpa:.2f} vs Objetivo: ${target_cpa:.2f}) con {purchases} ventas.\"\n                recommendations.append(\"Transferir este ID de anuncio/post a una campa\u00f1a Advantage+ Shopping (ASC).\")\n                recommendations.append(\"Asignar presupuesto inicial de 5X a 10X CPA Objetivo diario y escalar 20% cada 48h.\")\n            else:\n                status = \"\ud83d\udfe2 ESCALAR VERTICAL (+20%)\"\n                action_color = \"success\"\n                decision_label = \"Rendimiento Rentable\"\n                explanation = f\"ROAS de {real_roas:.2f}x por encima del Break-Even con CPA saludable.\"\n                recommendations.append(\"Aumentar presupuesto diario un 20% para no reiniciar la fase de aprendizaje de Meta.\")\n        else:\n            status = \"\ud83d\udfe1 MANTENER / HOLD\"\n            action_color = \"info\"\n            decision_label = \"Margen Aceptable en Observaci\u00f3n\"\n            explanation = f\"ROAS de {real_roas:.2f}x supera ligeramente el Break-Even ({be_roas:.2f}x), pero no alcanza el umbral de escala agresiva.\"\n            recommendations.append(\"Mantener presupuesto constante y monitorear frecuencia de anuncios para evitar fatiga creativa.\")\n\n        # Secondary Creative Diagnostics\n        if ctr_link < 1.0 and impressions > 1000:\n            recommendations.append(f\"\u26a0\ufe0f CTR de Enlace bajo ({ctr_link}%). Los primeros 3 segundos (Hooks) deben ser m\u00e1s llamativos.\")\n        elif ctr_link >= 2.0:\n            recommendations.append(f\"\ud83d\udd25 CTR de Enlace sobresaliente ({ctr_link}%). El creativo tiene excelente poder de retenci\u00f3n.\")\n\n        return {\n            \"ad_name\": ad_name,\n            \"spend\": spend,\n            \"revenue\": revenue,\n            \"purchases\": purchases,\n            \"cpm\": cpm,\n            \"cpc\": cpc,\n            \"ctr_link\": ctr_link,\n            \"real_cpa\": real_cpa,\n            \"real_roas\": real_roas,\n            \"be_roas\": be_roas,\n            \"target_cpa\": target_cpa,\n            \"status\": status,\n            \"action_color\": action_color,\n            \"decision_label\": decision_label,\n            \"explanation\": explanation,\n            \"recommendations\": recommendations,\n        }\n", "modules/sourcing_hub.py": "\"\"\"\nSourcing Hub & Sourcing Economics Module\nCompares Dropshipping vs DDP Bulk Import economics (300 to 1,000 units) and generates professional English RFQs for Alibaba/1688 suppliers.\n\"\"\"\n\nfrom typing import Dict, Any, List\n\n\nclass SourcingHub:\n    \"\"\"\n    Handles transition economics from dropshipping validation to private label bulk import.\n    \"\"\"\n\n    @staticmethod\n    def calculate_margin_jump(\n        sale_price: float,\n        dropship_cogs_shipping: float,\n        factory_fob_unit: float,\n        ddp_shipping_unit: float,\n        packaging_branding_unit: float = 0.80,\n        local_3pl_pick_pack: float = 3.50,\n        payment_gateway_pct: float = 3.5,\n        target_cpa: float = 15.00,\n        units_batch: int = 500,\n    ) -> Dict[str, Any]:\n        \"\"\"\n        Calculates unit economics and net margin expansion comparing Dropshipping vs DDP Bulk Import.\n        \"\"\"\n        gateway_fee = round(sale_price * (payment_gateway_pct / 100.0), 2)\n\n        # 1. Dropshipping Economics (Unitary)\n        dropship_total_cost = round(dropship_cogs_shipping + gateway_fee + target_cpa, 2)\n        dropship_net_profit = round(sale_price - dropship_total_cost, 2)\n        dropship_net_margin_pct = round((dropship_net_profit / sale_price) * 100.0, 1) if sale_price > 0 else 0.0\n\n        # 2. Bulk DDP Import Economics (Unitary)\n        bulk_landed_cogs = round(factory_fob_unit + ddp_shipping_unit + packaging_branding_unit, 2)\n        bulk_total_cost = round(bulk_landed_cogs + local_3pl_pick_pack + gateway_fee + target_cpa, 2)\n        bulk_net_profit = round(sale_price - bulk_total_cost, 2)\n        bulk_net_margin_pct = round((bulk_net_profit / sale_price) * 100.0, 1) if sale_price > 0 else 0.0\n\n        # Batch Totals (e.g. 300, 500, 1000 units)\n        units = int(units_batch)\n        dropship_batch_profit = round(dropship_net_profit * units, 2)\n        bulk_batch_profit = round(bulk_net_profit * units, 2)\n        extra_profit_batch = round(bulk_batch_profit - dropship_batch_profit, 2)\n        profit_increase_pct = round(((bulk_net_profit - dropship_net_profit) / max(0.01, dropship_net_profit)) * 100.0, 1) if dropship_net_profit > 0 else 999.0\n\n        # Capital Required for Bulk Batch\n        capital_inventory_required = round(bulk_landed_cogs * units, 2)\n        roi_inventory_pct = round((bulk_batch_profit / capital_inventory_required) * 100.0, 1) if capital_inventory_required > 0 else 0.0\n\n        return {\n            \"sale_price\": sale_price,\n            \"target_cpa\": target_cpa,\n            \"gateway_fee\": gateway_fee,\n            \"dropship\": {\n                \"unit_cogs_shipping\": dropship_cogs_shipping,\n                \"total_unit_cost\": dropship_total_cost,\n                \"net_profit_unit\": dropship_net_profit,\n                \"net_margin_pct\": dropship_net_margin_pct,\n                \"batch_profit\": dropship_batch_profit,\n            },\n            \"bulk_ddp\": {\n                \"fob_unit\": factory_fob_unit,\n                \"ddp_freight_unit\": ddp_shipping_unit,\n                \"branding_unit\": packaging_branding_unit,\n                \"landed_cogs\": bulk_landed_cogs,\n                \"local_3pl\": local_3pl_pick_pack,\n                \"total_unit_cost\": bulk_total_cost,\n                \"net_profit_unit\": bulk_net_profit,\n                \"net_margin_pct\": bulk_net_margin_pct,\n                \"batch_profit\": bulk_batch_profit,\n                \"capital_required\": capital_inventory_required,\n                \"roi_inventory_pct\": roi_inventory_pct,\n            },\n            \"comparison\": {\n                \"units_batch\": units,\n                \"extra_profit_unit\": round(bulk_net_profit - dropship_net_profit, 2),\n                \"extra_profit_batch\": extra_profit_batch,\n                \"profit_increase_pct\": profit_increase_pct,\n            },\n        }\n\n    @staticmethod\n    def generate_rfq_message(\n        company_name: str,\n        contact_name: str,\n        product_name: str,\n        target_destination_country: str = \"United States (3PL Warehouse)\",\n        custom_logo: bool = True,\n        custom_box: bool = True,\n        barcode_labeling: bool = True,\n    ) -> str:\n        \"\"\"\n        Generates an authoritative, professional English RFQ (Request For Quotation) for Alibaba/1688 manufacturers.\n        \"\"\"\n        rfq_text = f\"\"\"Dear Sales Team / Factory Manager,\n\nMy name is {contact_name}, Purchasing Director at {company_name}. \n\nWe are expanding our DTC e-commerce catalog in the {target_destination_country} market and are currently sourcing qualified manufacturing partners for our upcoming private label production run of: **{product_name}**.\n\nWe would appreciate your prompt quotation based on the following specifications and tiered volumes:\n\n### 1. Tiered Pricing Request (FOB & EXW):\nPlease provide unit pricing based on order volume:\n- **Sample Order:** 1-2 units (air express via DHL/FedEx to evaluate build quality & finish)\n- **Tier 1 (Initial Test Batch):** 300 units\n- **Tier 2 (Scale Batch):** 500 units\n- **Tier 3 (Full Production):** 1,000 units\n- **Tier 4 (Annual Volume):** 3,000+ units\n\n### 2. Customization & Private Label Requirements:\n- **Custom Logo:** {\"Yes, laser engraved or silk-screen printed on product.\" if custom_logo else \"Standard product without logo.\"}\n- **Custom Packaging:** {\"Yes, customized matte cardboard box with full-color 4C printing and custom foam insert.\" if custom_box else \"Standard manufacturer packaging.\"}\n- **Barcodes & Inserts:** {\"Apply UPC/EAN barcode stickers on each box + include a custom 300gsm thank-you/instruction card.\" if barcode_labeling else \"Standard.\"}\n\n### 3. Shipping & Incoterms (DDP Quote):\nPlease provide estimated DDP (Delivered Duty Paid - air freight and sea freight) shipping rates and transit times to our fulfillment warehouse in: **{target_destination_country}**.\n\n### 4. Production & Quality Standards:\n- What is your standard production lead time for 500 - 1,000 units?\n- What are the dimensions (cm) and gross weight (kg) per master carton, and units per carton?\n- Do you accept third-party pre-shipment inspections (AQL 2.5 standard) and Alibaba Trade Assurance payment terms?\n\nPlease reply with your product catalog (PDF/Excel) and your best FOB & DDP quote at your earliest convenience.\n\nBest regards,\n\n**{contact_name}**\nPurchasing & Supply Chain Operations | {company_name}\nEmail / WhatsApp / WeChat Available Upon Request\n\"\"\"\n        return rfq_text.strip()\n", "modules/knowledge_base.py": "\"\"\"\nKnowledge Base & Persistence Layer\nStores operator rules (DTC Scale Framework, media buyers) and tracks product validation & learning logs in SQLite.\n\"\"\"\n\nimport json\nimport os\nimport sqlite3\nfrom datetime import datetime\nfrom typing import List, Dict, Any, Optional\n\nDB_FILE = os.path.join(os.path.dirname(__file__), \"..\", \"data\", \"ecom_data.db\")\nRULES_FILE = os.path.join(os.path.dirname(__file__), \"..\", \"data\", \"rules.json\")\n\n\nclass KnowledgeBase:\n    def __init__(self, db_path: str = DB_FILE, rules_path: str = RULES_FILE):\n        self.db_path = db_path\n        self.rules_path = rules_path\n        os.makedirs(os.path.dirname(self.db_path), exist_ok=True)\n        self._init_db()\n        self._seed_rules_if_empty()\n\n    def _get_connection(self) -> sqlite3.Connection:\n        conn = sqlite3.connect(self.db_path)\n        conn.row_factory = sqlite3.Row\n        return conn\n\n    def _init_db(self):\n        \"\"\"Initializes database tables if they do not exist.\"\"\"\n        with self._get_connection() as conn:\n            cursor = conn.cursor()\n            # Products evaluated and tested table\n            cursor.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS tested_products (\n                    id INTEGER PRIMARY KEY AUTOINCREMENT,\n                    product_name TEXT NOT NULL,\n                    category TEXT NOT NULL,\n                    product_type TEXT NOT NULL, -- 'Viral/Trend' or 'Evergreen'\n                    cost_unit REAL NOT NULL,\n                    target_price REAL NOT NULL,\n                    multiplier REAL NOT NULL,\n                    total_score INTEGER NOT NULL,\n                    verdict TEXT NOT NULL,\n                    status TEXT DEFAULT 'Evaluado', -- 'Evaluado', 'En Testeo', 'Escalado DDP', 'Descartado'\n                    notes TEXT,\n                    lessons_learned TEXT,\n                    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n                )\n            \"\"\")\n\n            # Operational Rules table\n            cursor.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS operational_rules (\n                    id TEXT PRIMARY KEY,\n                    author TEXT NOT NULL,\n                    category TEXT NOT NULL,\n                    title TEXT NOT NULL,\n                    rule TEXT NOT NULL,\n                    actionable_tip TEXT NOT NULL,\n                    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n                )\n            \"\"\")\n\n            # Search & Learning Log table\n            cursor.execute(\"\"\"\n                CREATE TABLE IF NOT EXISTS search_learning_log (\n                    id INTEGER PRIMARY KEY AUTOINCREMENT,\n                    search_query TEXT,\n                    category_filter TEXT,\n                    selected_product_name TEXT,\n                    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n                )\n            \"\"\")\n            conn.commit()\n\n    def _seed_rules_if_empty(self):\n        \"\"\"Loads default rules from data/rules.json if rules table is empty.\"\"\"\n        try:\n            with self._get_connection() as conn:\n                cursor = conn.cursor()\n                cursor.execute(\"SELECT COUNT(*) as cnt FROM operational_rules\")\n                count = cursor.fetchone()[\"cnt\"]\n                if count == 0 and os.path.exists(self.rules_path):\n                    with open(self.rules_path, \"r\", encoding=\"utf-8\") as f:\n                        data = json.load(f)\n                        for r in data.get(\"creator_rules\", []):\n                            cursor.execute(\"\"\"\n                                INSERT OR REPLACE INTO operational_rules (id, author, category, title, rule, actionable_tip)\n                                VALUES (?, ?, ?, ?, ?, ?)\n                            \"\"\", (r[\"id\"], r[\"author\"], r[\"category\"], r[\"title\"], r[\"rule\"], r[\"actionable_tip\"]))\n                    conn.commit()\n        except Exception as e:\n            print(f\"Warning: Could not seed rules: {e}\")\n\n    # --- Product History Methods ---\n    def save_product_evaluation(self, data: Dict[str, Any]) -> int:\n        \"\"\"Saves a product evaluation to the database.\"\"\"\n        with self._get_connection() as conn:\n            cursor = conn.cursor()\n            cursor.execute(\"\"\"\n                INSERT INTO tested_products \n                (product_name, category, product_type, cost_unit, target_price, multiplier, total_score, verdict, status, notes, lessons_learned)\n                VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\n            \"\"\", (\n                data.get(\"product_name\", \"Sin Nombre\"),\n                data.get(\"category\", \"General\"),\n                data.get(\"product_type\", \"Viral/Trend\"),\n                float(data.get(\"cost_unit\", 0.0)),\n                float(data.get(\"target_price\", 0.0)),\n                float(data.get(\"multiplier\", 0.0)),\n                int(data.get(\"total_score\", 0)),\n                data.get(\"verdict\", \"Descartado\"),\n                data.get(\"status\", \"Evaluado\"),\n                data.get(\"notes\", \"\"),\n                data.get(\"lessons_learned\", \"\")\n            ))\n            conn.commit()\n            return cursor.lastrowid\n\n    def get_all_products(self) -> List[Dict[str, Any]]:\n        \"\"\"Retrieves all saved products sorted by newest first.\"\"\"\n        with self._get_connection() as conn:\n            cursor = conn.cursor()\n            cursor.execute(\"SELECT * FROM tested_products ORDER BY created_at DESC\")\n            rows = cursor.fetchall()\n            return [dict(row) for row in rows]\n\n    def update_product_status(self, product_id: int, status: str, lessons_learned: Optional[str] = None):\n        \"\"\"Updates the status and lessons learned for a tested product.\"\"\"\n        with self._get_connection() as conn:\n            cursor = conn.cursor()\n            if lessons_learned is not None:\n                cursor.execute(\"\"\"\n                    UPDATE tested_products \n                    SET status = ?, lessons_learned = ?\n                    WHERE id = ?\n                \"\"\", (status, lessons_learned, product_id))\n            else:\n                cursor.execute(\"\"\"\n                    UPDATE tested_products \n                    SET status = ?\n                    WHERE id = ?\n                \"\"\", (status, product_id))\n            conn.commit()\n\n    def delete_product(self, product_id: int):\n        \"\"\"Deletes a product from history.\"\"\"\n        with self._get_connection() as conn:\n            cursor = conn.cursor()\n            cursor.execute(\"DELETE FROM tested_products WHERE id = ?\", (product_id,))\n            conn.commit()\n\n    # --- Rules Methods ---\n    def get_all_rules(self) -> List[Dict[str, Any]]:\n        \"\"\"Retrieves all operating rules.\"\"\"\n        with self._get_connection() as conn:\n            cursor = conn.cursor()\n            cursor.execute(\"SELECT * FROM operational_rules ORDER BY category, title\")\n            rows = cursor.fetchall()\n            return [dict(row) for row in rows]\n\n    def add_custom_rule(self, author: str, category: str, title: str, rule: str, actionable_tip: str) -> str:\n        \"\"\"Adds a custom rule to the knowledge base.\"\"\"\n        rule_id = f\"rule_custom_{int(datetime.now().timestamp())}\"\n        with self._get_connection() as conn:\n            cursor = conn.cursor()\n            cursor.execute(\"\"\"\n                INSERT INTO operational_rules (id, author, category, title, rule, actionable_tip)\n                VALUES (?, ?, ?, ?, ?, ?)\n            \"\"\", (rule_id, author, category, title, rule, actionable_tip))\n            conn.commit()\n        return rule_id\n\n    # --- Search & Learning Methods ---\n    def log_search(self, search_query: str, category_filter: str, selected_product_name: Optional[str] = None):\n        \"\"\"Logs user search query to track interests and train system patterns.\"\"\"\n        with self._get_connection() as conn:\n            cursor = conn.cursor()\n            cursor.execute(\"\"\"\n                INSERT INTO search_learning_log (search_query, category_filter, selected_product_name)\n                VALUES (?, ?, ?)\n            \"\"\", (search_query.strip(), category_filter, selected_product_name))\n            conn.commit()\n\n    def get_search_learning_insights(self) -> Dict[str, Any]:\n        \"\"\"Analyzes historical search logs to surface trending niches and search frequency.\"\"\"\n        with self._get_connection() as conn:\n            cursor = conn.cursor()\n            cursor.execute(\"SELECT COUNT(*) as total_searches FROM search_learning_log\")\n            total_searches = cursor.fetchone()[\"total_searches\"]\n\n            cursor.execute(\"\"\"\n                SELECT category_filter, COUNT(*) as cnt \n                FROM search_learning_log \n                WHERE category_filter != 'Todas las Categor\u00edas'\n                GROUP BY category_filter \n                ORDER BY cnt DESC LIMIT 5\n            \"\"\")\n            top_categories = [dict(row) for row in cursor.fetchall()]\n\n            cursor.execute(\"\"\"\n                SELECT selected_product_name, COUNT(*) as cnt \n                FROM search_learning_log \n                WHERE selected_product_name IS NOT NULL AND selected_product_name != ''\n                GROUP BY selected_product_name \n                ORDER BY cnt DESC LIMIT 5\n            \"\"\")\n            top_analyzed_products = [dict(row) for row in cursor.fetchall()]\n\n            cursor.execute(\"SELECT * FROM search_learning_log ORDER BY created_at DESC LIMIT 10\")\n            recent_logs = [dict(row) for row in cursor.fetchall()]\n\n            return {\n                \"total_searches\": total_searches,\n                \"top_categories\": top_categories,\n                \"top_analyzed_products\": top_analyzed_products,\n                \"recent_logs\": recent_logs,\n            }\n", "data/rules.json": "{\n  \"creator_rules\": [\n    {\n      \"id\": \"rule_dtc_01\",\n      \"author\": \"DTC Scale Framework\",\n      \"category\": \"Validation & Margin\",\n      \"title\": \"Regla del Margen M\u00ednimo 3X-5X\",\n      \"rule\": \"Nunca testear un producto cuyo precio de venta no sea al menos el triple de su costo unitario puesto en destino (COGS + Shipping). El margen bruto debe absorber el CPA de prueba ($15-$25) y dejar al menos un 25% de margen neto.\",\n      \"actionable_tip\": \"Si el producto cuesta $10 en origen, el PVP m\u00ednimo sugerido es $39.99 a $49.99. Si el mercado no tolera ese precio, descartar de inmediato.\"\n    },\n    {\n      \"id\": \"rule_dtc_02\",\n      \"author\": \"DTC Scale Framework\",\n      \"category\": \"Transition & Scale\",\n      \"title\": \"La Transici\u00f3n Dropshipping -> DDP a Gran Escala\",\n      \"rule\": \"El Dropshipping es el term\u00f3metro de validaci\u00f3n \u00e1gil de mercado. En cuanto un producto logre 30 a 50 pedidos con ROAS estable en 7 d\u00edas, se congela el stock local y se negocia la primera orden de 500 a 1,000 unidades v\u00eda DDP a\u00e9reo/mar\u00edtimo para duplicar el margen neto y crear Private Label.\",\n      \"actionable_tip\": \"Solicitar siempre muestra f\u00edsica y personalizaci\u00f3n de logo/empaque antes de transferir el 70% restante al fabricante.\"\n    },\n    {\n      \"id\": \"rule_meta_322\",\n      \"author\": \"Meta Performance Benchmark\",\n      \"category\": \"Creatives & Testing\",\n      \"title\": \"Estructura Din\u00e1mica 3:2:2\",\n      \"rule\": \"En cada adset de prueba subir exactamente 3 Hooks visuales diferentes (primeros 3 segundos), 2 Variaciones de cuerpo/demostraci\u00f3n (PAS o AIDA), y 2 Textos principales + T\u00edtulos atractivos.\",\n      \"actionable_tip\": \"Meta optimiza din\u00e1micamente qu\u00e9 combinaci\u00f3n de Hook + Cuerpo entrega el menor CPA.\"\n    },\n    {\n      \"id\": \"rule_kill_scale_01\",\n      \"author\": \"Media Buying Standard\",\n      \"category\": \"Pauta & Ads\",\n      \"title\": \"Regla de Corte de Sangr\u00eda (Stop-Loss)\",\n      \"rule\": \"Si un anuncio gasta 1X el CPA Objetivo sin registrar compras, o 0.5X CPA Objetivo sin registrar ning\u00fan 'Add to Cart', se apaga de forma implacable antes de la medianoche.\",\n      \"actionable_tip\": \"No esperar a que gaste 2X o 3X el CPA por 'esperanza'. El algoritmo ya detect\u00f3 falta de resonancia.\"\n    },\n    {\n      \"id\": \"rule_scale_asc_01\",\n      \"author\": \"Media Buying Standard\",\n      \"category\": \"Escalamiento ASC\",\n      \"title\": \"Paso a Campa\u00f1a Advantage+ Shopping (ASC)\",\n      \"rule\": \"Solo transferir los 2-3 creativos ganadores que hayan sostenido un ROAS > 2.2x durante al menos 72 horas consecutivas en la campa\u00f1a de CBO/ABO de testeo.\",\n      \"actionable_tip\": \"Arrancar ASC con un presupuesto equivalente a 5X-10X el CPA Objetivo y subir un 20% cada 48h si el ROAS se mantiene sobre el Break-Even.\"\n    }\n  ]\n}\n"};
    
    stlite.mount({
      requirements: ["pandas", "requests"],
      entrypoint: "app.py",
      files: files
    }, document.getElementById("root"));
